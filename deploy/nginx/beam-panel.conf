# BEAM Control Panel — nginx reverse proxy.
#
#   sudo cp deploy/nginx/beam-panel.conf /etc/nginx/sites-available/beam-panel
#   sudo ln -s /etc/nginx/sites-available/beam-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.example.com
#
# LiveView работает по WebSocket — блок map/Upgrade обязателен.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream beam_panel_upstream {
  server 127.0.0.1:4000 fail_timeout=0;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name panel.example.com;

  # certbot добавит редирект на HTTPS автоматически
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name panel.example.com;

  # пути подставит certbot
  # ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 50m;
  proxy_buffering off;

  # статика отдаётся релизом, но кешируем на стороне nginx
  location ~* ^/assets/ {
    proxy_pass http://beam_panel_upstream;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://beam_panel_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # деплой и провижининг стримят вывод часами — таймауты щедрые
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
